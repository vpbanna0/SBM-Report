name: Build & Deploy SBM Report

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize uploaded filenames (if uploaded from mobile)
        continue-on-error: true
        run: |
          [ -f public/block-page.html ] && cp -f public/block-page.html public/block.html || true
          [ -f public/block-v2.html ] && cp -f public/block-v2.html public/block.html || true
          [ -f public/block-engine.js ] && cp -f public/block-engine.js public/block-report.js || true
          [ -f public/block-report-v2.js ] && cp -f public/block-report-v2.js public/block-report.js || true
          [ -f public/block-report.js ] && cp -f public/block-report.js public/block_report.js || true
          [ -f scripts/build-block.js ] && cp -f scripts/build-block.js scripts/build-block-report.js || true
          [ -f scripts/build-data.js ] && cp -f scripts/build-data.js scripts/build-static-data.js || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        continue-on-error: true
        run: npm install --no-audit --no-fund

      - name: Build latest workbook.json & block-report.json from Google Drive
        continue-on-error: true
        run: |
          npm run build:data || true
          node scripts/build-block-report.js || node scripts/build_block_report.js || true
        env:
          GOOGLE_DRIVE_FILE_ID: ${{ vars.GOOGLE_DRIVE_FILE_ID }}

      - name: Ensure GitHub Pages does not run Jekyll
        run: touch public/.nojekyll

      - name: Commit updated workbook.json & block-report.json
        id: commit_data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp public/data/workbook.json /tmp/workbook.json 2>/dev/null || true
          cp public/data/block-report.json /tmp/block-report.json 2>/dev/null || true

          git fetch origin ${{ github.ref_name }} || true
          git reset --hard origin/${{ github.ref_name }} || true
          mkdir -p public/data
          touch public/.nojekyll

          [ -f /tmp/workbook.json ] && cp /tmp/workbook.json public/data/workbook.json || true
          [ -f /tmp/block-report.json ] && cp /tmp/block-report.json public/data/block-report.json || true

          git add public/ public/data/workbook.json public/data/block-report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update workbook.json & block-report.json data snapshot [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
