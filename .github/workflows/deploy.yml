name: Deploy GitHub Pages Snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install LibreOffice + UNO bridge + Hindi fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice libreoffice-calc python3-uno xvfb \
            fonts-lohit-deva fonts-noto-core fonts-noto-extra --no-install-recommends
          libreoffice --version

      - name: Install custom legacy fonts (Kruti Dev / DevLys, if provided)
        run: |
          mkdir -p ~/.fonts
          if [ -d "fonts" ]; then
            cp fonts/*.ttf ~/.fonts/ 2>/dev/null || true
            cp fonts/*.TTF ~/.fonts/ 2>/dev/null || true
          fi
          fc-cache -f -v

      - name: Install Node dependencies
        run: npm install
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Install Python dependencies
        run: pip install requests openpyxl --break-system-packages --quiet

      - name: Build GP Report static data (workbook.json)
        run: node scripts/build-static-data.js
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}

      - name: Build Block Report PDF (LibreOffice UNO)
        run: python3 scripts/build-block-pdf.py
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
