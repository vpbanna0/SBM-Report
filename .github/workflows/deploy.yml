name: Build & Deploy SBM Report

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build latest workbook.json & block-report.json from Google Drive
        run: |
          npm run build:data
          if [ ! -f public/data/block-report.json ]; then
            node scripts/build-block-report.js || node scripts/build_block_report.js
          fi
        env:
          GOOGLE_DRIVE_FILE_ID: ${{ vars.GOOGLE_DRIVE_FILE_ID }}

      - name: Ensure GitHub Pages does not run Jekyll
        run: touch public/.nojekyll

      - name: Commit updated workbook.json & block-report.json (agar naya data aaya ho)
        id: commit_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/workbook.json public/data/block-report.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-update workbook.json & block-report.json data snapshot [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes detected, skipping commit."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
